name: Sync calendar and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # Run once per hour, offset from the busy top-of-hour window.
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the static site
        run: node scripts/check.mjs
      - name: Synchronize the public calendar
        run: node scripts/sync-calendar.mjs
      - name: Build the Pages artifact
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R assets data _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
